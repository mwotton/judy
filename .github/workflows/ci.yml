name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    name: cabal test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Judy
        run: |
          sudo apt-get update
          sudo apt-get install -y libjudy-dev

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.12.2"
          cabal-version: "3.16.0.0"

      - name: Configure
        run: cabal update

      - name: Build
        run: cabal build all

      - name: Test
        run: cabal test all

      - name: Coverage
        run: |
          cabal test --enable-coverage all
          scripts/check-coverage.sh
